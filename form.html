<body>
    <h1>Form Pemesanan Pizza</h>
        <p>Silahkan isi form pemesanan ini dengan lengkap dan benar

        </p>
        <form action="#" method="post">
            <fieldset>
                <legend>Informasi Pemesanan</legend>
                <p>
                    <label for="customername">nama:</label>
                    <input type="text" id="customername" name="customename" required>
                </p>
                <p>
                    <label for="address">address:</label>
                    <input type="text" id="address" name="address" required>
                </p>
                <p>
                    <label for="telephone">telephone:</label>
                    <input type="text" id="telephone" name="telephone" required>
                </p>
                <p>
                    <label for="email">email:</label>
                    <input type="text" id="email" name="email" required>
                </p>
                <p>
                     <label for="instruction">delivery instruction:</label><br>
                     <textarea 
                     id="instruction"
                     name="instruction"
                     rows="4"
                     cols="50"
                     maxlength="400"
                     placeholder="no more than 400 characters"></textarea>
                </p>
            </fieldset>

            <fieldset>
                <legend>Design your dream pizza</legend>
                <p><strong>pizza specs</strong></p>
                <p>pilih salah satu</p>

                <p>
                <input type="radio" id="classic" name="crust" value="classic white" required>
                <label for="classic">classic white</label><br>
                </p>
                <p>
                <input type="radio" id="peperoni" name="crust" value="peperoni" required>
                <label for="peperoni">peperoni</label><br>
                </p>
                <p>
                <input type="radio" id="classic" name="crust" value="classic white" required>
                <label for="classic">classic white</label><br>
                </p>
                <p>
                <input type="radio" id="classic" name="crust" value="classic white" required>
                <label for="classic">classic white</label><br>
                </p>

                <p><strong>topping</strong></p>

                <p>
                     <input type="checkbox" id="classic" name="topping" value="classic white" required>
                <label for="classic">red sauce</label><br>
                </p>
                <p>
                <input type="checkbox" id="peperoni" name="topping" value="peperoni" required>
                <label for="peperoni">white sauce</label><br>
                </p>
                <p>
                <input type="checkbox" id="classic" name="topping" value="classic white" required>
                <label for="classic">mozzarela</label><br>
                </p>
                <p>
                <input type="checkbox" id="classic" name="topping" value="classic white" required>
                <label for="classic">mushrooms</label><br>

                </p>

                <p>
                    <input type="submit" value="Bring me a pizza!">
                    <input type="reset" value="Reset"
               ,  </p>
                
            </fieldset>
        </form>
